services:
  - type: web
    name: pearls-aqi-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20
    envVars:
      - key: STORAGE_MODE
        value: hopsworks
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false
      - key: HOPSWORKS_API_KEY
        sync: false
      - key: HOPSWORKS_PROJECT
        sync: false
      - key: HOPSWORKS_HOST
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
