project_name: pearls_aqi_predictor
feature_group_name: aqi_features
feature_group_version: 3
model_name: aqi_forecast_model
model_version_alias: production

horizons_hours: [24, 48, 72]

backfill_days: 365

lag_hours: [1, 3, 6, 12, 24, 48, 72]
rolling_windows_hours: [6, 12, 24]
per_horizon_models: true
realistic_mode: true
forecast_weather_noise:
  enabled: true
  scale_24h: 0.08
  scale_48h: 0.12
  scale_72h: 0.16
prediction_interval_level: 0.8
random_seed: 42
test_size_days: 28
validation_size_days: 28

monitoring:
  enabled: true
  log_path: artifacts/monitoring/forecast_log.parquet
  summary_path: artifacts/monitoring/summary.json
  backfill_sample_hours: 6
  backfill_score_days: 60

aqi_thresholds:
  good: 50
  moderate: 100
  unhealthy_sensitive: 150
  unhealthy: 200
  very_unhealthy: 300
  hazardous: 301

cities:
  - name: Lahore
    country: Pakistan
    lat: 31.5204
    lon: 74.3587
  - name: Karachi
    country: Pakistan
    lat: 24.8607
    lon: 67.0011
  - name: Islamabad
    country: Pakistan
    lat: 33.6844
    lon: 73.0479
  - name: Peshawar
    country: Pakistan
    lat: 34.0151
    lon: 71.5249
  - name: Quetta
    country: Pakistan
    lat: 30.1798
    lon: 66.9750

hopsworks:
  project_name: mateen_pearls_aqi
  host: eu-west.cloud.hopsworks.ai
  feature_store_online: true

storage:
  local_dir: data/processed
  leaderboard_path: artifacts/model_leaderboard.json
  shap_path: artifacts/shap_summary.json
  model_dir: artifacts/models
