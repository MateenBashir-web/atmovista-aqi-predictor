name: Feature Pipeline Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: auto
        run: python pipelines/feature_pipeline.py --past-days 2

      - name: Log forecasts and reconcile actuals
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: auto
        run: python pipelines/monitor_pipeline.py

      - name: Upload local feature mirror
        uses: actions/upload-artifact@v4
        with:
          name: aqi-features
          path: data/processed/
          if-no-files-found: warn
