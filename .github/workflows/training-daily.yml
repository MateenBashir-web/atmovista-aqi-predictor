name: Training Pipeline Daily

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill recent history if needed
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: auto
        run: python pipelines/backfill.py --days 90 --chunk-days 20

      - name: Train and evaluate models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: auto
        run: python pipelines/training_pipeline.py --lstm-epochs 8

      - name: Sync to Hopsworks (features + model registry)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: hopsworks
        run: |
          for i in 1 2 3; do
            python pipelines/hopsworks_sync.py && exit 0
            echo "Hopsworks sync attempt $i failed; retrying in 45s"
            sleep 45
          done
          python pipelines/hopsworks_sync.py

      - name: Seed / refresh monitoring scores
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_MODE: auto
        run: python pipelines/monitor_pipeline.py --seed-history

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            artifacts/
            data/processed/
